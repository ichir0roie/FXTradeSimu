# R009: 事前分布の中心の重み prior_long_weight を 0.25 と 0.75 でも比べる(r009_anchor_prior.yaml の続き)
# 日中の順張り(E011 / E012 で偽薬でも素の損益が残った 4 本)と、R008 の逆張りの組(戻りが出ていないか)を、
# fair ブローカーで回して素の損益を見る。並べ替えのブロックは verify と同じ 250 日
name: R009 anchor prior sweep
proposal: R009
years: 30
seeds: [1, 2, 3, 4, 5, 6]
storage: {candle_timeframe: 1440, equity_detail_timeframe: 10080, equity_timeframe: 43200, trades: none, events: false}
brokers: [fair]
markets:
  - {model: real_bootstrap, label: bootstrap_w25, params: {source: {block_days: 250}, anchor: {prior_long_weight: 0.25}}}
  - {model: real_bootstrap, label: bootstrap_w75, params: {source: {block_days: 250}, anchor: {prior_long_weight: 0.75}}}
  - {model: real_bridge_placebo, label: placebo_w25, params: {anchor: {prior_long_weight: 0.25}}}
  - {model: real_bridge_placebo, label: placebo_w75, params: {anchor: {prior_long_weight: 0.75}}}
strategies:
  - {name: donchian_breakout, label: B002_donchian_h1, params: {timeframe: 60, entry_n: 48, exit_n: 24, atr_n: 24, sl_atr: 2.0}}
  - {name: heikin_ashi, label: B020_heikin_h4, params: {timeframe: 240}}
  - {name: london_breakout, label: B029_london_m15, params: {timeframe: 15}}
  - {name: macd_cross, label: B023_macd_h4, params: {timeframe: 240}}
  - {name: rsi_reversion, label: B025_rsi_h1, params: {timeframe: 60}}
  - {name: stochastic_reversion, label: B026_stoch_h1, params: {timeframe: 60}}
  - {name: bollinger_reversion, label: B003_bollinger_h1, params: {timeframe: 60, n: 24, k: 2.0, atr_n: 24, sl_atr: 2.5, max_hold: 48}}
  - {name: random_entry, label: B006_random_h1, params: {timeframe: 60, entry_prob: 0.05, atr_n: 24, sl_atr: 2.0, tp_atr: 2.0}}
