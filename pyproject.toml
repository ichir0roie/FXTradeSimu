[project]
name = "fxsim"
version = "0.2.0"
description = "Malicious FX market simulator and long-horizon strategy backtester"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "PyYAML>=6.0"]

[project.optional-dependencies]
fast = ["scipy>=1.11"]
test = ["pytest>=8"]

[project.scripts]
fxsim = "fxsim.cli:main"

[tool.setuptools.packages.find]
include = ["fxsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
