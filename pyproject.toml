[project]
name = "fxsim"
version = "0.2.0"
description = "Malicious FX market simulator and long-horizon strategy backtester"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "PyYAML>=6.0"]

[project.optional-dependencies]
fast = ["scipy>=1.11"]
test = ["pytest>=8"]
# fxsim trade を Linux から Wine の MT5 につなぐとき(Windows なら MetaTrader5、docs/TRADING.md)
trade = ["rpyc>=6"]

[project.scripts]
fxsim = "fxsim.cli:main"

[tool.setuptools.packages.find]
include = ["fxsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E741", "SIM108"]   # l(low)などの短い変数名、三項演算子への書き換えは強制しない
